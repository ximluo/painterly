[project]
name = "painterly"
version = "0.1.0"
description = "Painterly rendering with depth-ordered strokes: Hertzmann '98 meets Depth Anything V2"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "pillow>=10.0",
    "torch>=2.3",
    "transformers>=4.44",
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
painterly = "painterly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/painterly"]
